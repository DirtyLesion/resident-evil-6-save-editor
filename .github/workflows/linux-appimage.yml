name: Linux AppImage

on:
  push:
    branches: [main, linux-appimage]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-wayland libfuse2 xvfb
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build
      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
      - name: Package and smoke-test AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        run: |
          export PATH="$PWD:$PATH"
          export QMAKE=/usr/lib/qt6/bin/qmake
          export LDAI_OUTPUT="$PWD/RE6SaveEditor-${LINUXDEPLOY_OUTPUT_VERSION}-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          test -s "$LDAI_OUTPUT"
          chmod +x "$LDAI_OUTPUT"

          # Verify both X11/XCB and native Wayland plugins are bundled.
          test -f AppDir/usr/plugins/platforms/libqxcb.so
          test -f AppDir/usr/plugins/platforms/libqwayland-egl.so
          test -f AppDir/usr/plugins/platforms/libqwayland-generic.so

          # Validate the Type 2 runtime can extract the image and that the
          # bundled application launches in a headless CI display.
          mkdir appimage-smoke-test
          cd appimage-smoke-test
          "$LDAI_OUTPUT" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/RE6SaveEditor
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          test -f squashfs-root/usr/plugins/platforms/libqwayland-egl.so
          test -f squashfs-root/usr/plugins/platforms/libqwayland-generic.so
          set +e
          xvfb-run -a timeout 5s ./squashfs-root/AppRun
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "AppImage smoke test failed with exit code $status"
            exit "$status"
          fi
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: RE6SaveEditor-AppImage
          path: RE6SaveEditor-*.AppImage
          if-no-files-found: error

  # Keep release write access separate from the build that executes downloaded
  # packaging tools; this job only uploads the already-built artifact.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RE6SaveEditor-AppImage
      - name: Attach AppImage to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: RE6SaveEditor-*.AppImage
